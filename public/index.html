<!DOCTYPE html>
<html lang="ja" data-theme="navy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>シネマチケットメモ</title>
<style>
  :root{
    --bg:#0f1420;
    --glow:rgba(232,181,68,.16);
    --paper:#f8f4ea;
    --paper-past:#e7e3d8;
    --ink:#1b1a17;
    --ink-soft:#6a6459;
    --line:#d9d3c4;
    --gold:#e8b544;
    --gold-deep:#c99622;
    --red:#e0524f;
    --panel:#171d2b;
    --panel-2:#1f2637;
    --panel-line:#2c3446;
    --panel-ink:#eef1f6;
    --panel-ink-soft:#9aa3b5;
    --radius:16px;
  }
  [data-theme="black"]{
    --bg:#000000;
    --glow:rgba(232,181,68,.10);
    --paper:#fafafa;
    --paper-past:#e6e6e6;
    --ink:#141414;
    --ink-soft:#666;
    --line:#dcdcdc;
    --panel:#101010;
    --panel-2:#191919;
    --panel-line:#2b2b2b;
    --panel-ink:#f2f2f2;
    --panel-ink-soft:#8f8f8f;
  }
  [data-theme="white"]{
    --bg:#ecedf1;
    --glow:rgba(181,133,15,.10);
    --paper:#ffffff;
    --paper-past:#f1f2f5;
    --ink:#1c2029;
    --ink-soft:#7a808c;
    --line:#e3e6ec;
    --gold:#b5850f;
    --gold-deep:#8f6a0b;
    --red:#d23f3c;
    --panel:#ffffff;
    --panel-2:#f3f4f7;
    --panel-line:#e2e5ec;
    --panel-ink:#1c2029;
    --panel-ink-soft:#6b7280;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--panel-ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    min-height:100vh;
    min-height:100dvh;
    transition:background .3s ease, color .3s ease;
  }
  body::before{
    content:"";
    position:fixed;
    top:-30vh;left:50%;
    transform:translateX(-50%);
    width:120vw;height:80vh;
    background:radial-gradient(closest-side, var(--glow), transparent 70%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:max(20px,env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
  }

  /* Hamburger */
  .hamburger{
    position:absolute;
    top:max(20px,env(safe-area-inset-top));
    left:12px;
    z-index:3;
    width:42px;height:42px;
    border:none;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;gap:5px;
    padding:10px;border-radius:10px;
  }
  .hamburger span{display:block;height:2px;background:var(--panel-ink);border-radius:2px;}
  .hamburger:hover{background:rgba(128,128,128,.12);}

  /* Header */
  header{text-align:center;padding:18px 0 22px;}
  .marquee{display:inline-block;font-size:12px;letter-spacing:.28em;color:var(--gold);padding-bottom:6px;}
  h1{margin:2px 0 0;font-size:29px;font-weight:800;letter-spacing:.02em;}
  .tally{margin-top:10px;font-size:13px;color:var(--panel-ink-soft);}
  .tally b{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;}

  /* Primary add button */
  .add-btn{
    display:block;width:100%;margin:6px 0 26px;padding:15px 18px;
    background:var(--gold);color:#241c04;border:none;border-radius:13px;
    font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
    box-shadow:0 8px 22px -10px var(--gold);
    transition:transform .12s ease, filter .12s ease;
  }
  .add-btn:hover{filter:brightness(1.05);}
  .add-btn:active{transform:translateY(1px);}

  /* Sections */
  .section-head{display:flex;align-items:baseline;gap:9px;margin:8px 2px 14px;}
  .section-head h2{margin:0;font-size:15px;font-weight:700;color:var(--panel-ink);}
  .section-head .count{font-size:12px;color:var(--panel-ink-soft);font-variant-numeric:tabular-nums;}
  .section-head.past h2{color:var(--panel-ink-soft);}
  .section-head.now h2{color:var(--red);}
  .section + .section{margin-top:34px;}

  /* Ticket card */
  .ticket{
    position:relative;background:var(--paper);color:var(--ink);
    border-radius:12px;margin-bottom:11px;
    box-shadow:0 4px 14px -10px rgba(0,0,0,.5);overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  [data-theme="white"] .ticket{border:1px solid var(--line);box-shadow:0 3px 10px -8px rgba(20,30,60,.3);}
  .ticket.past{background:var(--paper-past);opacity:.82;}
  .ticket.now{box-shadow:0 4px 14px -8px rgba(224,82,79,.5);}
  .ticket.now::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--red);z-index:2;}
  .ticket.show-actions{box-shadow:0 6px 20px -8px rgba(0,0,0,.6);}
  .ticket-body{padding:13px 15px;display:flex;gap:13px;align-items:flex-start;}
  .when{flex:0 0 auto;text-align:center;min-width:52px;padding-right:12px;border-right:1px solid var(--line);}
  .when .md{font-size:20px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .when .dow{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .when .time{margin-top:5px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);}
  .when .time.none{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .when .endtime{font-size:12px;color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;}
  .info{flex:1 1 auto;min-width:0;}
  .title{font-size:16px;font-weight:800;line-height:1.3;word-break:break-word;}
  .theater{margin-top:3px;font-size:13px;color:var(--ink-soft);word-break:break-word;}
  .meta-row{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em;white-space:nowrap;}
  .fmt-imax{background:#215d9c;color:#fff;}
  .fmt-4dx{background:#d96a1c;color:#fff;}
